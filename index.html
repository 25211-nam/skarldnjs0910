<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>세포 생존기: 덱빌딩 로그라이크 (완전판)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
        body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 10px; overflow-x: hidden; }
        
        /* VFX Overlays */
        #damage-flash { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(239, 68, 68, 0.45); pointer-events: none; z-index: 999; display: none; }
        .flash-anim { animation: flashShake 0.4s ease-out; }
        @keyframes flashShake {
            0% { opacity: 1; transform: translate(0, 0); }
            25% { transform: translate(-10px, 6px); }
            50% { transform: translate(10px, -6px); }
            75% { transform: translate(-5px, 3px); }
            100% { opacity: 0; transform: translate(0, 0); }
        }

        #acid-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle, rgba(168,85,247,0.4) 0%, rgba(34,197,94,0.6) 100%);
            pointer-events: none; z-index: 998; display: none; mix-blend-mode: color-dodge;
        }
        .acid-anim { animation: acidMelt 0.8s ease-in-out forwards; }
        @keyframes acidMelt {
            0% { opacity: 0; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.05); }
            100% { opacity: 0; transform: scale(1); }
        }

        #drain-beam {
            position: absolute; top: 50%; left: 30%; width: 40%; height: 8px;
            background: linear-gradient(90deg, #eab308 0%, #ef4444 100%);
            box-shadow: 0 0 15px #eab308; pointer-events: none; z-index: 90;
            display: none; border-radius: 4px;
        }
        .beam-anim { animation: beamSyphon 0.7s ease-in-out forwards; }
        @keyframes beamSyphon {
            0% { opacity: 0; width: 0%; left: 30%; }
            50% { opacity: 1; width: 40%; left: 30%; }
            100% { opacity: 0; width: 0%; left: 70%; }
        }

        .card-burn {
            animation: cardBurnAnim 0.6s ease-out forwards !important;
            border-color: #ef4444 !important;
        }
        @keyframes cardBurnAnim {
            0% { transform: scale(1) rotate(0deg); filter: brightness(1); }
            50% { transform: scale(1.15) rotate(5deg); filter: brightness(2) drop-shadow(0 0 15px #ef4444); background: #7f1d1d; }
            100% { transform: scale(0) rotate(-20deg); opacity: 0; }
        }

        #app { width: 100%; max-width: 860px; background: #1e293b; border: 2px solid #334155; border-radius: 14px; padding: 16px; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { text-align: center; color: #38bdf8; font-size: 22px; font-weight: 800; margin-bottom: 2px; }
        .sub-title { text-align: center; color: #94a3b8; font-size: 11px; margin-bottom: 12px; }

        .btn { background: #22c55e; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; transition: 0.15s; }
        .btn:hover { background: #16a34a; }
        .btn:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
        .btn-sec { background: #0f172a; border: 1px solid #334155; color: #cbd5e1; }
        .btn-sec:hover { background: #334155; color: #fff; }

        /* Setup Screen */
        .setup-screen { display: flex; flex-direction: column; gap: 10px; }
        .info-panel { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 10px 14px; font-size: 11.5px; color: #cbd5e1; line-height: 1.4; }
        .info-panel b { color: #38bdf8; }
        
        .preset-btns { display: flex; gap: 8px; justify-content: center; }
        .deck-select-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 8px; max-height: 280px; overflow-y: auto; padding: 8px; background: #0f172a; border-radius: 8px; border: 1px solid #334155; }
        
        .card-item { background: #1e293b; border: 2px solid #334155; border-radius: 8px; padding: 8px; text-align: center; cursor: pointer; transition: all 0.15s; position: relative; }
        .card-item:hover { transform: translateY(-2px); }
        .card-item.selected { border-color: #38bdf8 !important; background: rgba(56, 189, 248, 0.25) !important; box-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }
        .card-item.selected::after { content: '✓'; position: absolute; top: 4px; left: 4px; background: #38bdf8; color: #000; border-radius: 50%; width: 18px; height: 18px; font-size: 11px; font-weight: bold; display: flex; align-items: center; justify-content: center; }
        
        .card-secretion { border-color: #a855f7 !important; box-shadow: 0 0 6px rgba(168, 85, 247, 0.2); }
        .card-energy { border-color: #22c55e !important; box-shadow: 0 0 6px rgba(34, 197, 94, 0.2); }
        .card-homeo { border-color: #f97316 !important; box-shadow: 0 0 6px rgba(249, 115, 22, 0.2); }

        .card-item .cost { position: absolute; top: 4px; right: 4px; background: #eab308; color: #000; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
        .card-title { font-weight: bold; font-size: 12px; margin-bottom: 2px; color: #f8fafc; }
        .card-tag { display: inline-block; font-size: 9px; padding: 1px 4px; border-radius: 3px; background: #334155; color: #94a3b8; margin-bottom: 2px; }
        .card-desc { font-size: 10px; color: #cbd5e1; line-height: 1.25; text-align: left; }

        /* Game Screen */
        .game-screen { display: none; flex-direction: column; gap: 10px; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 8px 12px; border-radius: 8px; border: 1px solid #334155; }
        .status-group { display: flex; gap: 12px; font-weight: bold; font-size: 13px; }

        .timer-bg { width: 100%; background: #0f172a; border-radius: 4px; height: 6px; overflow: hidden; border: 1px solid #334155; }
        .timer-fill { height: 100%; width: 100%; background: #38bdf8; transition: width 1s linear, background 0.3s; }
        .timer-fill.urgent { background: #ef4444; }

        .enemy-area { background: #1e293b; border: 2px solid #ef4444; border-radius: 8px; padding: 12px; text-align: center; position: relative; overflow: hidden; }
        .enemy-area.hit { animation: enemyShake 0.35s ease-in-out; background: #3b1111; }
        @keyframes enemyShake { 0% { transform: translate(0,0); } 25% { transform: translate(-8px, 4px); } 50% { transform: translate(8px, -4px); } 75% { transform: translate(-4px, 2px); } 100% { transform: translate(0,0); } }

        .enemy-icon { font-size: 40px; margin-bottom: 2px; filter: drop-shadow(0 0 8px rgba(239,68,68,0.5)); }
        
        .dmg-popup { position: absolute; top: 15%; left: 50%; transform: translateX(-50%); font-size: 32px; font-weight: 900; color: #f87171; text-shadow: 0 0 10px #ef4444; pointer-events: none; animation: floatDmg 0.75s forwards ease-out; }
        .dmg-popup.speed-bonus { color: #facc15 !important; text-shadow: 0 0 15px #eab308 !important; font-size: 40px !important; }
        @keyframes floatDmg { 0% { opacity: 1; transform: translate(-50%, 0) scale(1.2); } 100% { opacity: 0; transform: translate(-50%, -40px) scale(0.9); } }

        #speed-bonus-indicator {
            position: absolute; top: 8px; right: 12px; font-size: 11px; font-weight: bold; color: #eab308;
            background: rgba(234, 179, 8, 0.15); border: 1px solid rgba(234, 179, 8, 0.4); padding: 2px 8px; border-radius: 12px;
            display: none; animation: pulseGlow 1s infinite alternate;
        }
        @keyframes pulseGlow { 0% { opacity: 0.7; } 100% { opacity: 1; transform: scale(1.03); } }

        .hp-bar-bg { background: #334155; height: 14px; border-radius: 7px; overflow: hidden; margin-top: 6px; position: relative; }
        .hp-bar-fill { background: #ef4444; height: 100%; width: 100%; transition: width 0.3s; }

        #combo-banner { background: #22c55e; color: #fff; padding: 6px; border-radius: 6px; text-align: center; font-weight: bold; font-size: 12px; display: none; }

        .hand-area { display: flex; gap: 8px; justify-content: center; min-height: 145px; flex-wrap: wrap; }
        .game-card { width: 115px; height: 145px; background: #1e293b; border: 2px solid #334155; border-radius: 8px; padding: 6px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; transition: transform 0.15s; position: relative; }
        .game-card:hover { transform: translateY(-6px); }
        .game-card .cost-badge { position: absolute; top: 4px; right: 4px; background: #eab308; color: #000; border-radius: 50%; width: 20px; height: 20px; font-size: 11px; font-weight: bold; display: flex; align-items: center; justify-content: center; }

        .log-area { background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 6px 10px; height: 65px; overflow-y: auto; font-size: 11px; color: #94a3b8; line-height: 1.3; }

        /* Modals */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.9); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: #1e293b; border: 2px solid #334155; border-radius: 12px; width: 90%; max-width: 520px; padding: 16px; max-height: 90vh; overflow-y: auto; }
        .combo-row { background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 6px 8px; margin-bottom: 5px; font-size: 11.5px; }

        .reward-card { background: #0f172a; border: 2px solid #38bdf8; border-radius: 8px; padding: 10px; margin-bottom: 8px; text-align: center; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .reward-card:hover { background: rgba(56, 189, 248, 0.2); transform: scale(1.02); }

        .rank-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
        .rank-table th, .rank-table td { border: 1px solid #334155; padding: 6px; text-align: center; }
        .rank-table th { background: #0f172a; color: #38bdf8; }

        /* Feedback Modal */
        #feedback-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 101; }
        .feedback-content { background: #1e293b; border: 2px solid #eab308; border-radius: 12px; width: 90%; max-width: 480px; padding: 18px; color: #f8fafc; }

        /* Quiz Quiz Option Styling */
        .quiz-option-btn { width: 100%; text-align: left; background: #0f172a; border: 1px solid #334155; color: #f8fafc; padding: 8px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; margin-bottom: 6px; transition: 0.15s; }
        .quiz-option-btn:hover { background: #334155; border-color: #38bdf8; }
    </style>
</head>
<body>

<div id="damage-flash"></div>
<div id="acid-overlay"></div>
